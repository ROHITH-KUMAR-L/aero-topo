server:
  host: "127.0.0.1"
  port: 8000
  cors_origins:
    - "*"

models:
  cgan:
    name: "Pix2Pix-cGAN-FLAME3"
    enabled: true
    checkpoint_path: "models/checkpoints/generator_best.pth"
    device: "cuda"
    image_size: 256
    input_channels: 1
    output_channels: 3
    huggingface:
      repo_id: "rohithkumarl/FLAME3-DIFFUSION"
      filename: "generator_best.pth"

  fusion:
    name: "FF-Fusion"
    enabled: false
    device: "cuda"
    fp16: true
    checkpoint_path: "models/checkpoints/ff_fusion.pth"

  depth:
    name: "Depth-Anything-V2-Small"
    enabled: true
    encoder: "vits"
    mode: "relative"
    device: "cuda"
    fp16: true
    checkpoint_path: "models/checkpoints/depth_anything_v2.pth"
    huggingface:
      repo_id: "depth-anything/Depth-Anything-V2-Small-hf"
      filename: "model.safetensors"

camera:
  fx: null
  fy: null
  cx: null
  cy: null

storage:
  results_dir: "results"
  models_dir: "models/checkpoints"
  data_dir: "data"