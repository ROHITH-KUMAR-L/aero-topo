version: '3.8'

services:
  aero-topo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aero-topo-engine
    ports:
      - "8000:8000"
    volumes:
      # Mount model weights directory for persistent storage across container restarts
      - ./models/checkpoints:/app/models/checkpoints
      - ./results:/app/results
      # Cache Hugging Face models on host machine
      - hf_cache:/app/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hf_cache:
    driver: local
